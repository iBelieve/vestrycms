version: 2
updates:
  # The npm ecosystem reads pnpm-lock.yaml when that is the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
      # Our own package, exempt from the release-age delay in
      # pnpm-workspace.yaml too.
      exclude:
        - latest-or-bust
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
