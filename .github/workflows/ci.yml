name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails a pull request that adds or changes a dependency at anything
      # but its newest release. Pushes to master and Dependabot's pull
      # requests pass with nothing to check.
      - run: pnpm check:deps
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm fallow
      - run: pnpm typecheck
      - run: pnpm test:coverage
      # Complexity and CRAP scores (from the coverage above); fails on any
      # function over the limits.
      - run: pnpm health
      - run: pnpm build
      - run: npm pack --dry-run
